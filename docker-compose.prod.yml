# Production Docker Compose for AWS EC2
# This file pulls pre-built images from Docker Hub

services:
  phonebook-mysql:
    image: devalapallitharun/phonebook-mysql:latest
    container_name: phonebook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  flask-app:
    image: devalapallitharun/phonebook-flask:latest
    container_name: flask-app
    environment:
      DB_HOST: phonebook-mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
    depends_on:
      phonebook-mysql:
        condition: service_healthy
    ports:
      - "8181:8181"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
